# Python env for the diagnostics. R is included only for `segmented` (via rpy2).
# The authors' R notebook runs in the separate env in environment-r.yml:
# conda-forge's R and Python xgboost 1.7 builds cannot share one env.
name: stormflow-diag
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - statsmodels
  - scikit-learn
  - py-xgboost=1.7       # same version as the authors' R xgboost 1.7.9.1; loads their JSON models
  - pyreadr              # upstream/data/Training_IDs.RData
  - pyarrow
  - pytest
  - rpy2
  - r-base=4.3
  - r-segmented          # Muggeo's breakpoint regression and score test
