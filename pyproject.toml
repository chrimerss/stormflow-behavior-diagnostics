[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stormflow_diag"
version = "0.1.0"
description = "Robustness diagnostics for Ameli, Sharif & McDonnell (2026) global hydrologic functional classification"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
